name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Commit message lint ───────────────────────────────────────────────────
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high --production
        continue-on-error: true  # warn but don't block until baseline is clean

  # ── API: lint + typecheck + prisma validate ─────────────────────────────────
  api:
    name: API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusion
          POSTGRES_PASSWORD: fusion
          POSTGRES_DB: fusion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fusion:fusion@localhost:5432/fusion_test
      JWT_SECRET: ci-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum
      NODE_ENV: test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Prisma validate schema
        run: npx prisma validate

      - name: Prisma generate client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  # ── API tests (unit + integration) ────────────────────────────────────────
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusion
          POSTGRES_PASSWORD: fusion
          POSTGRES_DB: fusion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fusion:fusion@localhost:5432/fusion_test
      JWT_SECRET: ci-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum
      NODE_ENV: test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Unit + integration tests
        run: npm test -- --coverage --coverageDirectory coverage --coverageReporters json-summary

      - name: Coverage gate (≥70%)
        run: |
          COVERAGE=$(node -e "
            const s = require('./coverage/coverage-summary.json');
            const pct = s.total.lines.pct;
            console.log(pct);
          ")
          echo "Line coverage: $COVERAGE%"
          node -e "if ($COVERAGE < 70) { console.error('Coverage below 70%'); process.exit(1); }"

  # ── AI Agent eval (runs on AI file changes only) ───────────────────────────
  agent-eval:
    name: Agent eval
    runs-on: ubuntu-latest
    needs: [api-tests]
    if: |
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      (
        contains(github.event.head_commit.modified, 'api/src/core/ai/') ||
        contains(github.event.head_commit.modified, 'api/src/routes/ai-actions.ts') ||
        contains(github.event.head_commit.modified, 'api/src/__tests__/ai/agents.eval.test.ts') ||
        contains(github.event.head_commit.added, 'api/src/core/ai/') ||
        contains(github.event.head_commit.added, 'api/src/routes/ai-actions.ts') ||
        contains(github.event.head_commit.added, 'api/src/__tests__/ai/agents.eval.test.ts')
      )
    concurrency:
      group: agent-eval-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusion
          POSTGRES_PASSWORD: fusion
          POSTGRES_DB: fusion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fusion:fusion@localhost:5432/fusion_test
      JWT_SECRET: ci-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum
      NODE_ENV: test

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Run agent eval tests
        run: npm test -- --testPathPattern="agents.eval" --coverage --coverageDirectory coverage --coverageReporters json lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-coverage
          path: api/coverage/lcov.info
          retention-days: 14

  # ── Frontend: lint + typecheck + build ───────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ''

  # ── Final gate ───────────────────────────────────────────────────────────
  all-green:
    name: All checks passed
    needs: [api-tests, api, frontend, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.api.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All CI jobs passed ✓"

  # ── Staging auto-deploy (merge to main only) ─────────────────────────────
  deploy-staging:
    name: Deploy to staging
    needs: [all-green]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Build & push API image
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          IMAGE_API: ${{ vars.IMAGE_API || 'fusion-api' }}
          SHA: ${{ github.sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:${SHA} \
                       -t ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:staging \
                       ./api
          docker push ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:${SHA}
          docker push ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:staging
        continue-on-error: true  # don't fail if GHCR not configured yet

      - name: Run DB migrations on staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL not set — skipping migration"
            exit 0
          fi
          cd api && npm ci --omit=dev && npx prisma migrate deploy
        continue-on-error: true

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deploy triggered for commit ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

  # ── Production deploy (tagged release, manual approval) ──────────────────
  deploy-production:
    name: Deploy to production
    needs: [all-green]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Build & push production API image
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          IMAGE_API: ${{ vars.IMAGE_API || 'fusion-api' }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:${TAG} \
                       -t ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:latest \
                       ./api
          docker push ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:${TAG}
          docker push ${REGISTRY}/${{ github.repository_owner }}/${IMAGE_API}:latest
        continue-on-error: true

      - name: Run DB migrations on production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL not set — skipping migration"
            exit 0
          fi
          cd api && npm ci --omit=dev && npx prisma migrate deploy
        continue-on-error: true

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deploy triggered for tag ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
