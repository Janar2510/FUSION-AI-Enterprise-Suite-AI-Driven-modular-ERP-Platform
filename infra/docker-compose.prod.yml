version: '3.8'

# ── FusionAI Enterprise Suite — Production Compose ──────────────────────────
# Usage:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
#
# TLS termination: handled by the nginx-proxy service.
# Set SSL_CERT_PATH + SSL_KEY_PATH env vars pointing to your cert/key files,
# or use certbot/ACME via the commented-out certbot service below.

x-api-env: &api-env
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
  NODE_ENV: production
  PORT: 3001
  JWT_SECRET: ${JWT_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  CORS_ORIGIN: ${CORS_ORIGIN}
  SENTRY_DSN: ${SENTRY_DSN:-}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_ENDPOINT: http://otel-collector:4318/v1/traces
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    # No external port — only accessible within the backend network

  # ── Redis (session store + outbox queue) ────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  # ── Node API ─────────────────────────────────────────────────
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Python AI backend ────────────────────────────────────────
  ai-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Outbox relay worker ──────────────────────────────────────
  worker:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/jobs/worker.js"]
    environment:
      <<: *api-env
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  # ── React frontend (nginx) ───────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: unless-stopped
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy (TLS termination) ───────────────────
  nginx-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-/etc/ssl/certs/fusionai.crt}:/etc/ssl/certs/fusionai.crt:ro
      - ${SSL_KEY_PATH:-/etc/ssl/private/fusionai.key}:/etc/ssl/private/fusionai.key:ro
    depends_on:
      - api
      - frontend
    networks: [frontend]

  # ── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks: [backend, monitoring]
    # /metrics endpoint NOT exposed externally — only via monitoring network

  # ── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"   # Restrict to VPN/admin IP in production firewall
    depends_on:
      - prometheus
    networks: [monitoring]

  # ── OpenTelemetry Collector ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    restart: unless-stopped
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    networks: [backend, monitoring]

networks:
  backend:
    driver: bridge
    internal: true     # backend services not reachable from host
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
