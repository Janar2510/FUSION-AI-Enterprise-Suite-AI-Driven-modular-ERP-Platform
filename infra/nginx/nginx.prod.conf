# FusionAI Enterprise Suite — Production Nginx Config
# Handles TLS termination, reverse proxy to API + frontend, and /metrics protection.

upstream api {
    server api:3001;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${NGINX_HOST:-localhost};

    # TLS
    ssl_certificate     /etc/ssl/certs/fusionai.crt;
    ssl_certificate_key /etc/ssl/private/fusionai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Request size limit
    client_max_body_size 20m;

    # API
    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /metrics — block external access (only Prometheus on monitoring network should call this)
    location /metrics {
        deny all;
    }

    # Health/ready probes (used by load balancers / k8s)
    location ~ ^/(api/health|api/ready)$ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket (Discuss module)
    location /ws/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Frontend (everything else)
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        # SPA fallback — serve index.html for any unknown path
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        proxy_pass http://frontend/index.html;
    }
}
