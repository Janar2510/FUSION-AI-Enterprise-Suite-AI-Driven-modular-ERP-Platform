version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: fusionai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fusionai
      POSTGRES_USER: fusionai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fusionai_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusionai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js + Express + Prisma API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fusionai-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fusionai:${DB_PASSWORD:-fusionai_secret}@db:5432/fusionai
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend (built with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: fusionai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
